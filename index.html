<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notenfindung | Mathematik | v12</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="script.js"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>

    <div class="wrapper">

        <div class="left container">

            <div class="title">Notenfindung</div>

            <div>
                <label class="lbl_punkte" for="slider">
                    Maximale Punktzahl:
                    <output style="color: black;" id="maxPunkte">10</output>
                </label>
                <input type="range" id="slider" min="20" max="100"
                    value="60" step="1" list="steplist"
                    oninput="maxPunkte.value= slider.value" style="width: 300px;">
                <!-- <datalist id="steplist"></datalist> -->
            </div>

        </div>

        <div class="right">

            <div class="container">
                <div class="title">
                    Punkte - Überblick
                </div>
                <div class="tbl">
                    <table class="noten">
                        <thead>
                            <tr>
                                <th colspan="3">Note</th>
                                <th colspan="2">Sek 1: 50%</th>
                                <th colspan="2">Sek 2: 40%</th>
                            </tr>
                            <tr>
                                <th>1-6</th>
                                <th>in Worten</th>
                                <th>0-15</th>
                                <th>Prozent</th>
                                <th>ab Punkte</th>
                                <th>Prozent</th>
                                <th>ab Punkte</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <div class="container">
                <div class="title">
                    <div>Erwartungshorizont | <span>Sek 1</span> | 50%</div>
                    <button class="btn-copy-table" onclick="tabelleKopieren_sek1()">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"  fill="none"  stroke="currentColor" stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-copy"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M7 7m0 2.667a2.667 2.667 0 0 1 2.667 -2.667h8.666a2.667 2.667 0 0 1 2.667 2.667v8.666a2.667 2.667 0 0 1 -2.667 2.667h-8.666a2.667 2.667 0 0 1 -2.667 -2.667z" /><path d="M4.012 16.737a2.005 2.005 0 0 1 -1.012 -1.737v-10c0 -1.1 .9 -2 2 -2h10c.75 0 1.158 .385 1.5 1" /></svg>
                        Tabelle kopieren
                    </button>
                </div>
                <div class="tbl">
                    <table id="tbl-ewh-sek1" class="ewh sek1">
                        <thead>
                            <tr>
                                <th>Note</th>
                                <th>sehr gut</th>
                                <th>gut</th>
                                <th>befriedigend</th>
                                <th>ausreichend</th>
                                <th>mangelhaft</th>
                                <th>ungenügend</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <div class="container">
                <div class="title">
                    <div>Erwartungshorizont | <span>Sek 2</span> | 40%</div>
                    <button class="btn-copy-table" onclick="tabelleKopieren_sek2()">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"  fill="none"  stroke="currentColor" stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-copy"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M7 7m0 2.667a2.667 2.667 0 0 1 2.667 -2.667h8.666a2.667 2.667 0 0 1 2.667 2.667v8.666a2.667 2.667 0 0 1 -2.667 2.667h-8.666a2.667 2.667 0 0 1 -2.667 -2.667z" /><path d="M4.012 16.737a2.005 2.005 0 0 1 -1.012 -1.737v-10c0 -1.1 .9 -2 2 -2h10c.75 0 1.158 .385 1.5 1" /></svg>
                        Tabelle kopieren
                    </button>
                </div>
                <div class="tbl">
                    <table id="tbl-ewh-sek2" class="ewh sek2">
                        <thead>
                            <tr>
                                <th>Note</th>
                                <th>+</th>
                                <th>1</th>
                                <th>-</th>
                                <th>+</th>
                                <th>2</th>
                                <th>-</th>
                                <th>+</th>
                                <th>3</th>
                                <th>-</th>
                                <th>+</th>
                                <th>4</th>
                                <th>-</th>
                                <th>+</th>
                                <th>5</th>
                                <th>-</th>
                                <th>6</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

        </div>

    </div>
    
    
</body>

</html>
