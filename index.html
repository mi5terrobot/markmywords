<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notenfindung | Mathematik | v12</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="script.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="wrapper">

        <div class="left container">

            <div>Notenfindung</div>

            <div>
                <label class="lbl_punkte" for="slider">
                    Maximale Punktzahl:
                    <output style="color: black;" id="maxPunkte">10</output>
                </label>
                <input type="range" id="slider" min="20" max="100"
                    value="60" step="1" list="steplist"
                    oninput="maxPunkte.value= slider.value" style="width: 300px;">
                <!-- <datalist id="steplist"></datalist> -->
            </div>

        </div>

        <div class="right">

            <div class="container">
                <div>
                    Punkte - Überblick
                </div>
                <table class="tbl noten">
                    <thead>
                        <tr>
                            <th colspan="3">Note</th>
                            <th colspan="2">Sek 1: 50%</th>
                            <th colspan="2">Sek 2: 40%</th>
                        </tr>
                        <tr>
                            <th>1-6</th>
                            <th>in Worten</th>
                            <th>0-15</th>
                            <th>Prozent</th>
                            <th>ab Punkte</th>
                            <th>Prozent</th>
                            <th>ab Punkte</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <div class="container">
                <div>
                    EWH (Sek 1: 50%)
                    <!-- <button>Tabelle kopieren</button> -->
                </div>
                <table class="tbl ewh sek1">
                    <thead>
                        <tr>
                            <th>sehr gut</th>
                            <th>gut</th>
                            <th>befriedigend</th>
                            <th>ausreichend</th>
                            <th>mangelhaft</th>
                            <th>ungenügend</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <div class="container">
                <div>
                    EWH (Sek 2: 40%)
                    <!-- <button>Tabelle kopieren!</button> -->
                </div>
                <table class="tbl ewh sek2">
                    <thead>
                        <tr>
                            <th>+</th>
                            <th>1</th>
                            <th>-</th>
                            <th>+</th>
                            <th>2</th>
                            <th>-</th>
                            <th>+</th>
                            <th>3</th>
                            <th>-</th>
                            <th>+</th>
                            <th>4</th>
                            <th>-</th>
                            <th>+</th>
                            <th>5</th>
                            <th>-</th>
                            <th>6</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

        </div>

    </div>
    
    
</body>

</html>
